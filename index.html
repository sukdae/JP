<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>모두의 저포</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* 가로 휴대폰 한 화면: 직사각형 판(12×6칸) 둘레를 돌고, 판 안쪽에 사람 패·저포 막대·결과·게이지. 어두운 옻칠 단일 테마 */
:root{
  --lacquer:#1b1513; --lacquer2:#2a201c; --lacquer3:#35281f;
  --bronze:#c9a25a; --bronze-dim:#7d6640;
  --paper:#efe6d2; --paper-dim:#b9ad96;
  --seal:#c0533f;
  --hz:'Noto Serif TC','Songti TC','PingFang TC','MingLiU-ExtB','SimSun-ExtB',serif;
  --display:'Gowun Batang','Noto Serif TC','Noto Serif KR',serif;
  --body:'Gowun Dodum','Noto Sans KR','Noto Serif TC',system-ui,sans-serif;
  --gP:#b8473a; --gC:#5f7f9a; --gT:#8a6bb0; --gF:#3f8a86; --gS:#c9a25a;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--lacquer);color:var(--paper);font-family:var(--body);margin:0;box-sizing:border-box;
  padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px));padding-block:8px;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
.hz{font-family:var(--hz)}
.btn{background:transparent;border:1px solid var(--bronze);color:var(--paper);border-radius:6px;padding:.5em 1em;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
.btn.main{background:var(--bronze);color:var(--lacquer);font-weight:700}
.btn:disabled{opacity:.35;cursor:default}
.muted{color:var(--paper-dim)}
.tag{display:inline-block;font-size:11px;padding:0 .5em;border-radius:3px;margin-left:.4em;vertical-align:1px;color:var(--lacquer);font-family:var(--body)}
.tag.rec{background:#9fb6d8}.tag.leg{background:#c7a8e0}.tag.fic{background:#e0c27a}.tag.chk{background:#9a9a9a}.tag.lit{background:#e8a38f}.tag.re{background:#a8c79a}

#lobby{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:6vh;min-height:calc(100vh - 16px);justify-content:center}
#lobby .mark{text-align:center}
.menu{display:flex;flex-direction:column;gap:12px}
.btn.big{font-family:var(--display);font-size:clamp(20px,3vw,28px);padding:.7em 1em;border-radius:10px;letter-spacing:.1em}
.btn.back{align-self:flex-start}
#lobby .mark{font-family:var(--display);font-size:clamp(40px,10vw,68px);letter-spacing:.12em;color:var(--bronze);line-height:1}
#lobby .mark small{display:block;font-size:.26em;letter-spacing:.3em;color:var(--paper-dim);margin-top:.8em;font-family:var(--display)}
.panel{border:1px solid var(--bronze-dim);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--lacquer2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{background:var(--lacquer);border:1px solid var(--bronze-dim);color:var(--paper);border-radius:6px;padding:.45em .7em;font:inherit;font-size:15px;min-width:0;flex:1}
.seat{display:flex;gap:8px;align-items:center}
.seat .dot{width:24px;display:flex;justify-content:center}.seat .dot .chibi{width:22px}
.seat select{background:var(--lacquer);color:var(--paper);border:1px solid var(--bronze-dim);border-radius:6px;padding:.3em}

#game{display:flex;justify-content:center;align-items:flex-end;padding-bottom:calc(26px + 7vh);box-sizing:border-box;height:calc(100vh - 16px);min-height:300px;position:relative;perspective:1300px;perspective-origin:50% 10%;--tilt:40deg;--pw:clamp(104px,min(17vw,30vh),250px);
  background:radial-gradient(ellipse at 50% 70%,#2a211b,var(--lacquer) 70%)}
/* 2.5D: 판은 뒤로 눕고, 건물과 캐릭터는 판 위에 선다. 가운데 화면은 판 밖에서 평평하게 뜬다 */
#game #board{transform:rotateX(var(--tilt));transform-origin:50% 100%;transform-style:preserve-3d;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);aspect-ratio:1;width:min(calc(100vw - 2 * var(--pw) - 40px), calc((100vh - 16px - 96px) * 1.25));box-shadow:0 0 0 2px #c9a25a, 0 60px 80px rgba(0,0,0,.75)}
#game .cell{transform-style:preserve-3d;overflow:visible}
#game .cell .bld{transform-origin:50% 100%;transform:rotateX(calc(-1 * var(--tilt)));height:92%;width:58%;right:3%;bottom:40%}
#game .cell .bld.gold svg{filter:sepia(1) saturate(4.5) hue-rotate(-8deg) brightness(1.18) drop-shadow(0 0 4px #f5c75a)}
#game .cell .lab{position:absolute;left:3px;bottom:2px;max-width:62%;z-index:2}
#game .cell .nm{margin:0;font-size:calc(var(--bw,600px) / 9 * .17);line-height:1.1;word-break:keep-all;overflow-wrap:normal;white-space:normal}
#game .cell .pr{font-size:calc(var(--bw,600px) / 9 * .13)}
#game .cell.corner .lab{max-width:96%}
#game .cell .cimg{position:absolute;inset:14% 14% 26% 14%;opacity:.9;pointer-events:none}
#game .cell .cimg svg{width:100%;height:100%}
#game .cell.corner[id="c0"] .nm{font-family:var(--body);font-weight:700;letter-spacing:.12em;color:#f0d79a}
#eraBar{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:min(calc(100vw - 2 * var(--pw) - 40px),900px);z-index:9;display:flex;flex-direction:column;gap:2px}
#eraBar #era span{font-size:clamp(9px,1.05vw,13px)}
#eraBar #eraCap{font-size:clamp(10px,1.15vw,14px)}
.pc{position:absolute;z-index:9;width:var(--pw);aspect-ratio:1}
.pc.tl{left:6px;top:6px}.pc.tr{right:6px;top:6px}.pc.br{right:6px;bottom:6px}.pc.bl{left:6px;bottom:6px}
.pc .pl{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-size:calc(var(--pw) * .075);padding:10px;background:rgba(42,32,28,.94);border-width:2px;border-radius:10px}
.pc .pl b{font-size:1.35em;white-space:normal}
.pc .pl .cash{font-size:1.4em;font-weight:700;text-align:center}
.pc .pl .rank{text-align:center;line-height:1.45}
.pc .pl .face{width:calc(var(--pw) * .24)}
.pc .pl .rank{white-space:normal}
.rare{font-size:.75em;border:1px dashed currentColor;border-radius:3px;padding:0 .2em}
#game .cell.own::after{content:'';position:absolute;right:6%;bottom:34%;width:50%;height:16%;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(2px);pointer-events:none}
#game #tokens{transform-style:preserve-3d}
#game .tk{transform-style:preserve-3d;transform:rotateX(calc(-1 * var(--tilt)));transform-origin:0 0}
#game .tk .ch{width:calc(var(--bw,600px) / 9 * .5);left:calc(var(--bw,600px) / 9 * -.25)}
#game .ctrHole{grid-column:2/9;grid-row:2/9;background:radial-gradient(ellipse at 50% 50%,#3a2c22,#241b16 75%);position:relative}
#game .ctrHole i{position:absolute;width:0;height:0}
#game > #center{position:absolute;z-index:8;border-radius:8px;background:rgba(27,21,19,.84);box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;padding:8px 12px}
#game > #center #stage{flex:1;gap:6px}
#game > #center #mid{display:flex;align-items:center;gap:clamp(12px,2vw,28px);min-height:0}
#game > #center #tray{flex:none;height:auto;padding:0 4px}
#game > #center #rbox{flex:1;min-width:0}
#game > #center .st{width:clamp(16px,2.1vw,30px);height:clamp(60px,12vh,130px)}
#game > #center #sticks{gap:clamp(6px,1.4vw,18px)}
#game > #center #result{font-size:clamp(17px,2.8vw,40px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-wrap:nowrap;justify-content:center;min-height:1.25em}
#game > #center #stage{overflow:hidden}
#game > #center #result{position:relative;z-index:3;text-shadow:0 2px 8px #000}
#game > #center #mid{margin-top:4px;position:relative;z-index:1}
#game > #center #mid{flex:1}
#game > #center #faces{font-size:clamp(10px,1.2vw,15px)}
#game > #center #chips span{font-size:clamp(9px,1.05vw,13px);padding:.1em .45em}
#game > #center #say{font-size:clamp(11px,1.3vw,16px)}
#game > #center #actrow .btn{font-size:clamp(12px,1.4vw,18px);padding:.45em 1em}
#game > #center #gauge{height:clamp(18px,2.4vw,28px);max-width:none;min-width:140px}
#game > #center #gauge .lbl{font-size:clamp(9px,1vw,12px)}

#sideL{position:absolute;z-index:9;left:6px;top:calc(var(--pw) + 12px);bottom:calc(var(--pw) + 12px);width:var(--pw);display:flex;flex-direction:column;gap:6px;min-height:0}
#sideL .tools{display:flex;flex-wrap:wrap;gap:4px;margin:0}
#sideL .tools .btn{font-size:calc(var(--pw) * .07);padding:.3em .6em}
#liveLog{flex:1;min-height:0;overflow:hidden;font-size:calc(var(--pw) * .062);line-height:1.4;color:var(--paper-dim);display:flex;flex-direction:column;gap:3px;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
#liveLog .new{color:var(--paper)}
#game .edge{position:absolute;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 3px,transparent 3px 11px),linear-gradient(#8a6242,#5a3d27 45%,#2e1e13);box-shadow:inset 0 2px 0 #c9a25a}
#game .edge.front{left:0;right:0;top:100%;height:calc(var(--bw,600px) * .11);transform-origin:50% 0;transform:rotateX(-90deg)}
#game .edge.left{top:0;bottom:0;left:0;width:calc(var(--bw,600px) * .11);transform-origin:0 50%;transform:rotateY(90deg);background:linear-gradient(90deg,#6b4a30,#3a2618 60%,#1f150e);box-shadow:inset 2px 0 0 #c9a25a}
#game .edge.right{top:0;bottom:0;right:0;width:calc(var(--bw,600px) * .11);transform-origin:100% 50%;transform:rotateY(-90deg);background:linear-gradient(-90deg,#6b4a30,#3a2618 60%,#1f150e);box-shadow:inset -2px 0 0 #c9a25a}
@media (max-height:520px){ #game > #center #faces{display:none} #game > #center .st{height:clamp(46px,14vh,110px)} #game > #center #result{font-size:clamp(15px,5vh,30px)} #game > #center #actrow .btn{font-size:clamp(11px,3.4vh,16px);padding:.3em .8em} #game > #center #say{font-size:clamp(10px,3vh,14px)} }
#tiltBox{display:flex;align-items:center;gap:4px;font-size:clamp(9px,1vw,12px);color:var(--paper-dim)}
#tiltBox input{width:70px}
#board{position:relative;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(6,1fr);gap:2px;
  width:min(100%, calc((100vh - 16px) * 2.05));aspect-ratio:2.05/1;background:var(--bronze-dim);padding:2px;border-radius:6px}
.cell{position:relative;background:var(--lacquer2);overflow:hidden;cursor:pointer;min-width:0;display:flex;flex-direction:column;padding:2px 3px}
.cell .band{position:absolute;inset:0 0 auto;height:4px}
.cell .nm{font-family:var(--display);font-size:clamp(7.5px,1.15vw,13px);line-height:1.12;margin-top:4px;word-break:keep-all;overflow-wrap:anywhere;position:relative;z-index:1}
.cell .pr{font-size:clamp(6.5px,.85vw,10px);color:var(--paper-dim);font-variant-numeric:tabular-nums;position:relative;z-index:1}
.cell .bld{position:absolute;right:1px;bottom:1px;width:58%;height:62%;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none}
.cell .bld svg{width:100%;height:100%;overflow:visible}
.cell.own{box-shadow:inset 0 0 0 2px var(--oc)}
.cell.corner{background:var(--lacquer3)}
.cell.corner .nm{color:var(--bronze)}
.cell.cardc .nm{color:#e0cd9e}
.cell.pick{outline:2px dashed var(--bronze);outline-offset:-3px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{background:#4a3a2a}}
#tokens{position:absolute;inset:0;pointer-events:none;z-index:5}
.tk{position:absolute;width:0;height:0;transition:left .3s linear, top .3s linear}
.tk .ch{position:absolute;left:-12px;bottom:0;width:clamp(16px,2.1vw,26px)}
.tk .ch .chibi{width:100%}
.tk.hop .ch{animation:hop .3s ease-out}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-55%) scale(1.05,.95)}100%{transform:translateY(0)}}
.tk.cur .ch .chibi{filter:drop-shadow(0 0 4px #f0d79a)}
@media (prefers-reduced-motion:reduce){.tk{transition:none}.tk.hop .ch{animation:none}}
.chibi{overflow:visible;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}

#center{grid-column:2/12;grid-row:2/6;background:radial-gradient(ellipse at 55% 45%,#2f251f,var(--lacquer) 75%);display:grid;grid-template-columns:minmax(0,26%) minmax(0,1fr);gap:6px;padding:5px 8px;min-width:0;min-height:0}
#players{display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden}
.pl{border:1px solid var(--bronze-dim);border-radius:6px;padding:2px 6px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 6px;align-items:center;background:var(--lacquer2);font-size:clamp(8px,1vw,12px)}
.pl.cur{border-color:var(--bronze);box-shadow:0 0 0 1px var(--bronze)}
.pl.out{opacity:.35}
.pl .face{grid-row:span 2;width:clamp(16px,2.2vw,26px)}
.pl .face .chibi{width:100%}
.pl b{font-family:var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .cash{font-variant-numeric:tabular-nums;color:var(--bronze);text-align:right;white-space:nowrap}
.pl .rank{color:var(--paper-dim);grid-column:2/4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{display:flex;flex-direction:column;gap:3px;min-width:0;min-height:0}
#era{display:flex;gap:2px;align-items:center;min-width:0}
#era span{flex:1;text-align:center;font-size:clamp(7px,.85vw,11px);color:var(--paper-dim);border-bottom:2px solid #3a2e26;padding-bottom:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
#era span.past{color:var(--bronze-dim);border-color:var(--bronze-dim)}
#era span.now{color:var(--bronze);border-color:var(--bronze);font-weight:700}
#eraCap{font-size:clamp(8px,1vw,12px);color:var(--paper-dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px;min-height:0;align-items:center}
#tray{height:100%;min-height:0;display:flex;align-items:center;justify-content:center;perspective:500px}
#sticks{display:flex;gap:clamp(4px,1vw,12px);transform:rotateX(38deg);transform-style:preserve-3d}
.st{width:clamp(14px,1.9vw,24px);height:clamp(48px,7.4vw,96px);position:relative;transform-style:preserve-3d}
.st .f{position:absolute;inset:0;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0;border:1px solid #000}
.st .f.w{background:linear-gradient(90deg,#c9bb9c,#f6eedc 50%,#c9bb9c);color:#5a3a20;transform:translateZ(4px)}
.st .f.b{background:linear-gradient(90deg,#0d0a09,#3a2f29 50%,#0d0a09);color:#e0c27a;transform:rotateY(180deg) translateZ(4px)}
.st .f small{font-size:clamp(7px,.8vw,10px);font-family:var(--display);line-height:1}
.st .f svg{width:88%;height:auto}
.st .edge{position:absolute;top:4px;bottom:4px;width:8px;left:50%;margin-left:-4px;background:#6b5640;transform:rotateY(90deg)}
#rbox{display:flex;flex-direction:column;gap:3px;min-width:0}
#result{font-family:var(--display);font-size:clamp(14px,2.3vw,28px);color:var(--bronze);line-height:1.1;min-height:1.2em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#result .hz{font-size:1.15em}
.badge{font-family:var(--body);font-size:clamp(9px,1vw,12px);border-radius:999px;padding:.1em .6em;font-weight:700}
.badge.king{background:#e0b85a;color:#2a1a08}.badge.peon{background:#4a3c30;color:var(--paper-dim)}.badge.hit{background:#3f8a86;color:#fff}
#faces{font-size:clamp(8px,.95vw,12px);color:var(--paper-dim);min-height:1.2em}
#chips{display:flex;flex-wrap:wrap;gap:2px}
#chips span{font-size:clamp(7px,.85vw,11px);padding:0 .35em;border-radius:3px;background:#2a211b;color:#8f8371;border:1px solid transparent;white-space:nowrap}
#chips span.k{border-color:#6b5531}
#chips span.on{background:var(--bronze);color:var(--lacquer);font-weight:700}
#tleft{font-weight:700;color:#f0d79a;margin-right:.3em}#tleft.hurry{color:#e2574c}
#say{font-size:clamp(8.5px,1.05vw,13px);color:var(--paper);min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bubble{font-family:var(--display);font-size:clamp(9px,1.1vw,14px);color:#f0d79a;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
#actrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:2em}
#actrow .btn{font-size:clamp(10px,1.2vw,15px);padding:.35em .8em}
#gauge{flex:1;min-width:90px;max-width:260px;height:clamp(12px,1.6vw,18px);border-radius:999px;background:#2a211b;border:1px solid var(--bronze-dim);position:relative;overflow:hidden}
#gauge .sweet{position:absolute;top:0;bottom:0;left:70%;width:15%;background:rgba(63,138,134,.55)}
#gauge .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7d6640,#e0b85a)}
#gauge .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(7px,.8vw,10px);color:#fff;text-shadow:0 1px 2px #000}
.tools{display:flex;gap:4px;margin-left:auto}
.tools .btn{font-size:clamp(9px,1vw,12px);padding:.25em .6em}

#sheet{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--lacquer2);border-top:2px solid var(--bronze);padding:14px max(16px, env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  max-height:80vh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#sheet .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.zh{font-family:var(--hz);font-size:15px;color:#e8dcc2;line-height:1.6}
#sheet .src{font-size:12px;color:var(--paper-dim)}
#sheet p{margin:0;line-height:1.6}
#over{position:fixed;inset:0;z-index:30;background:rgba(15,11,9,.92);display:flex;align-items:center;justify-content:center;padding:16px}
#over .in{max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px}
#evt{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(10,8,7,.72);padding:16px;cursor:pointer}
#evt .in{max-width:520px;text-align:center;display:flex;flex-direction:column;gap:8px;animation:fadeup .5s ease}
#evt .yr{font-family:var(--display);color:var(--bronze);font-size:clamp(28px,5vw,52px);letter-spacing:.1em}
#evt h2{font-size:clamp(18px,2.6vw,28px)}
#evt p{margin:0;line-height:1.6;color:var(--paper)}
#evt .fx{color:#f0d79a;font-weight:700}
#story{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 35%,#3a2c20,#120e0c 70%);display:flex;align-items:center;justify-content:center;padding:24px max(16px, env(safe-area-inset-left,0px));cursor:pointer}
#story p{font-family:var(--display);font-size:clamp(17px,3vw,26px);line-height:1.85;text-align:center;max-width:30em;margin:0;animation:fadeup .6s ease}
#story .more{position:absolute;bottom:calc(5% + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:var(--paper-dim);font-size:13px}
#story .src{position:absolute;top:calc(3% + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:var(--paper-dim);font-size:12px}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:5px 4px;border-bottom:1px solid var(--bronze-dim);text-align:right;font-size:13px}

.rules{font-size:14px;line-height:1.65}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:var(--lacquer);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#rotate .phone{width:44px;height:74px;border:3px solid var(--bronze);border-radius:8px;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (max-width:820px){ #rotate{display:flex} }

  <p><b>관문</b>(나성·부소산성)에 멈추면 다음 차례에 왕채가 나와야 나가요. 30수전을 내면 바로 나가요.</p>
  <p><b>열두 턴.</b> 선두가 출발(사비 천도)이나 맞은편 구태묘 제사를 지날 때마다 다음 턴으로 넘어가요. 턴마다 그 시대(성왕 → 위덕왕 → 법왕·무왕 → 의자왕)의 사건 서너 개 가운데 하나가 무작위로 일어나요. 12턴 다음 바퀴에 660 사비 함락이 오면 점수를 세요.</p>
  <p><b>이기는 법.</b> ① 사비 함락 때 점수가 가장 높은 사람 ② 왕궁·성·절 가운데 두 무리를 다 가진 사람 ③ 좌평이 된 뒤 출발을 두 번 더 지난 사람 ④ 혼자 남은 사람(파산하면 탈락).</p>
  <p class="muted">기록·설화·창작·재현 이름·확인 중 표시는 칸과 카드에 붙어 있어요. 칸을 누르면 설명과 출처가 나와요.</p></div>`, 'rules');
}

/* =====================================================================
   7. 한 기기 / 방
   ===================================================================== */
const isHostSide = () => !NET || NET.host;
/* 차례 제한 10초: 온라인 방에서 사람 차례에만. 막대·말 움직임과 사건 창이 끝난 뒤부터 센다.
   방장이 시간을 재고, 끝나면 대신 움직인다 (던지기 · 지나가기 · 카드 닫기). */
const TURN_MS = 10000;
let tmKey = null, tmStart = 0, tmFired = null;
function turnClock(){
  const el = $('tleft');
  if(!G || G.over || !NET || cur().ai || cur().out){ if(el) el.textContent = ''; return; }
  if(G.seq !== tmKey){ tmKey = G.seq; tmStart = 0; }
  if(!tmStart){ if(animating() || !$('evt').hidden){ if(el) el.textContent = ''; return; } tmStart = Date.now(); }
  const left = Math.max(0, TURN_MS - (Date.now() - tmStart));
  if(el){ el.textContent = Math.ceil(left / 1000) + '초'; el.classList.toggle('hurry', left <= 3000); }
  if(left === 0 && isHostSide() && tmFired !== tmKey){ tmFired = tmKey; timeUp(); }
}
function timeUp(){
  const p = cur(), ph = G.phase;
  if(gauge.on && myTurn()) return gaugeEnd();
  let a = null;
  if(ph === 'throw') a = { k:'throw', x:0 };
  else if(['buy','up','take'].includes(ph)) a = { k:'skip' };
  else if(ph === 'card') a = { k:'ok' };
  else if(ph === 'tp') a = { k:'tp', x:(SONG() + 1) % N };
  else if(ph === 'pick'){ const m = myProps(p, G.pick.kind); if(m.length) a = { k:'pick', x:m[0] }; }
  if(a){ log(`${p.nm}: 시간 초과`); act(p.id, a); }
}
setInterval(turnClock, 200);
const myTurn = () => G && !G.over && ME && ME.includes(cur().id);
function send(a){
  if(!myTurn()) return;
  a = { ...a, s: G.seq };
  if(isHostSide()) act(cur().id, a);
  else { NET.n = (NET.n||0) + 1; NET.r.presence({ it:{ n:NET.n, pid:cur().id, a } }).catch(()=>{}); }
}
function publish(){
  if(NET && NET.host){ const st = { ...G, log: G.log.slice(-3) }; NET.r.presence({ st }).catch(e => console.warn('상태가 너무 큼?', e)); }
  render();
}
function enterGame(){
  for(const k in DISP) delete DISP[k];
  lastEvtN = 0; lastNoteN = G.note?.n || 0; lastThrowN = G.last?.n || 0;
  $('lobby').hidden = true; $('game').hidden = false; document.body.classList.add('ingame');

}

const seatState = [{ nm:'나', who:'me' }, { nm:'컴퓨터 1', who:'ai' }, { nm:'컴퓨터 2', who:'off' }, { nm:'컴퓨터 3', who:'off' }];

let fsAuto = true;
const isFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const canFS = () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function lockLand(){ try{ const o = screen.orientation; if(o && o.lock) o.lock('landscape').catch(()=>{}); }catch(e){} }
function enterFS(quiet){
  if(isFS()) return lockLand();

}

/* ---- Firebase 방 (아티팩트의 room과 같은 모양: join → presence / onPeers / peers) ----
   FB_CONFIG에 Firebase 콘솔 → 프로젝트 설정 → 내 앱(웹)의 firebaseConfig 값을 붙여 넣는다.
   apiKey는 비밀이 아니다. 보안은 Realtime Database 규칙이 맡는다 (자기 peers/{uid}에만 쓰기).
   상태는 JSON 문자열로 저장한다: Realtime Database는 null과 빈 배열을 지워 버리기 때문. */
const FB_CONFIG = {
  apiKey: 'AIzaSyAVSIFMxhpQRl3UtGaCZQ6-SXozK9LrJbw',
  authDomain: 'test-d810d.firebaseapp.com',
  databaseURL: 'https://test-d810d-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'test-d810d',
  appId: '1:837047713907:web:7de42e23de537cda69ea06',
};
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
async function firebaseRoom(){
  if(!FB_CONFIG.apiKey || !FB_CONFIG.databaseURL) throw new Error('FB_CONFIG가 비어 있음');
  const [{ initializeApp }, A, D] = await Promise.all(
    ['firebase-app.js','firebase-auth.js','firebase-database.js'].map(f => import(FB_SDK + f)));
  const app = initializeApp(FB_CONFIG), auth = A.getAuth(app), db = D.getDatabase(app);
  await A.setPersistence(auth, A.browserSessionPersistence);   // 탭마다 다른 사람 (새로고침해도 유지)
  const { user } = await A.signInAnonymously(auth);
  return { async join(name){
    const base = D.ref(db, `rooms/${name}/peers`), meRef = D.child(base, user.uid);
    const joined = Date.now(); let mine = {}, list = [];
    const subs = [];
    await D.onDisconnect(meRef).remove();                      // 창을 닫으면 방에서 빠짐
    D.onValue(base, snap => {
      list = Object.entries(snap.val() || {}).map(([uid, x]) => {
        let pr = {}; try{ pr = JSON.parse(x.j || '{}'); }catch(e){}
        return { peer:uid, kind:'viewer', presence:pr, isMe: uid === user.uid, sameTab: uid === user.uid, t: x.t || 0 };
      }).sort((a, b) => a.t - b.t);
      subs.forEach(f => f({ peers: list }));
    });
    return {
      presence(o){ Object.assign(mine, o); return D.set(meRef, { j: JSON.stringify(mine), t: joined }); },
      onPeers(f){ subs.push(f); },
      peers(){ return list; },
    };
  }};
}
let ROOM = null;
(async () => {
  try{ ROOM = await firebaseRoom(); }catch(e){ console.warn('Firebase 연결 실패:', e); ROOM = null; }
  if(!ROOM){ $('roomNote').textContent = '온라인 서버에 연결하지 못했어요. 지금은 한 기기에서 하기만 돼요.'; return; }
  $('roomNote').textContent = '방을 만들고 방 번호를 친구에게 알려 주세요. 2~4명.';
  $('roomCtl').hidden = false;
})();
async function openRoom(code, host){
  const nick = ($('nick').value || '').trim().slice(0,10) || (host ? '방장' : '손님');
  let r;
  try{ r = await ROOM.join('jeopo-' + code); }catch(e){ return alertLobby('방에 들어가지 못했어요. 잠시 뒤 다시 해 보세요.'); }
  NET = { r, host, code, nick, seen:{} };
  await r.presence({ nick, host, it:null, st:null }).catch(()=>{});
  $('roomCtl').hidden = true; $('waiting').hidden = false;
  r.onPeers(ch => onRoom(ch.peers));
  onRoom(r.peers());
}
$('mkRoom').onclick = () => openRoom(String(Math.floor(1000 + Math.random()*9000)), true);
$('joinRoom').onclick = () => { const c = ($('code').value||'').trim(); if(!/^\d{4}$/.test(c)) return alertLobby('방 번호 네 자리를 넣어 주세요.'); openRoom(c, false); };
function onRoom(peers){
  if(!NET) return;
  const people = peers.filter(p => p.kind === 'viewer' && p.presence && p.presence.nick);
  if(!G){
    const hostPeer = people.find(p => p.presence.host);
    $('waiting').innerHTML = `<b>방 번호 ${NET.code}</b><div class="muted" style="font-size:14px">${people.map(p => esc(p.presence.nick) + (p.presence.host?' (방장)':'') + (p.isMe&&p.sameTab?' · 나':'')).join(', ') || '연결하는 중…'}</div>` +
      (NET.host ? `<div class="row"><button class="btn main" id="goRoom" ${people.length<2?'disabled':''}>판 열기 (${Math.min(people.length,4)}명)</button></div>` : `<div class="muted" style="font-size:13px">${hostPeer ? '방장이 판을 열기를 기다리는 중…' : '방장을 찾는 중… 방 번호가 맞는지 확인해 주세요.'}</div>`);
    if(NET.host && $('goRoom')) $('goRoom').onclick = () => {
      startGame(newGame(people.slice(0,4).map(p => ({ id:p.peer, nm:p.presence.nick })))); ME = [people.find(p => p.isMe && p.sameTab).peer];
      enterGame(); publish();
    };
    if(!NET.host && hostPeer && hostPeer.presence.st){ G = JSON.parse(JSON.stringify(hostPeer.presence.st)); ME = [people.find(p => p.isMe && p.sameTab)?.peer]; enterGame(); }
    return;
  }
  if(NET.host){
    for(const p of people){
      const it = p.presence.it; if(!it || p.isMe) continue;
      if((NET.seen[p.peer]||0) >= it.n) continue;
      NET.seen[p.peer] = it.n;
      if(it.pid === p.peer) act(p.peer, it.a);
    }
  } else {
    const hostPeer = people.find(p => p.presence.host);
    if(hostPeer && hostPeer.presence.st && hostPeer.presence.st.seq !== G.seq){ G = JSON.parse(JSON.stringify(hostPeer.presence.st)); render(); }
  }
}
