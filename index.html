<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>모두의 저포</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* 가로 휴대폰 한 화면: 직사각형 판(12×6칸) 둘레를 돌고, 판 안쪽에 사람 패·저포 막대·결과·게이지. 어두운 옻칠 단일 테마 */
:root{
  --W:100vw; --H:100vh; --vw:1vw; --vh:1vh;
  --lacquer:#1b1513; --lacquer2:#2a201c; --lacquer3:#35281f;
  --bronze:#c9a25a; --bronze-dim:#7d6640;
  --paper:#efe6d2; --paper-dim:#b9ad96;
  --seal:#c0533f;
  --hz:'Noto Serif TC','Songti TC','PingFang TC','MingLiU-ExtB','SimSun-ExtB',serif;
  --display:'Gowun Batang','Noto Serif TC','Noto Serif KR',serif;
  --body:'Gowun Dodum','Noto Sans KR','Noto Serif TC',system-ui,sans-serif;
  --gP:#b8473a; --gC:#5f7f9a; --gT:#8a6bb0; --gF:#3f8a86; --gS:#c9a25a;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--lacquer);color:var(--paper);font-family:var(--body);margin:0;box-sizing:border-box;
  padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px));padding-block:8px;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
.hz{font-family:var(--hz)}
.btn{background:transparent;border:1px solid var(--bronze);color:var(--paper);border-radius:6px;padding:.5em 1em;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.btn.main{background:var(--bronze);color:var(--lacquer);font-weight:700}
.btn:disabled{opacity:.35;cursor:default}
.muted{color:var(--paper-dim)}
.tag{display:inline-block;font-size:11px;padding:0 .5em;border-radius:3px;margin-left:.4em;vertical-align:1px;color:var(--lacquer);font-family:var(--body)}
.tag.rec{background:#9fb6d8}.tag.leg{background:#c7a8e0}.tag.fic{background:#e0c27a}.tag.chk{background:#9a9a9a}.tag.lit{background:#e8a38f}.tag.re{background:#a8c79a}

#lobby{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:calc(6 * var(--vh));min-height:calc(var(--H) - 16px);justify-content:center}
#lobby .mark{text-align:center}
.menu{display:flex;flex-direction:column;gap:12px}
.btn.big{font-family:var(--display);font-size:clamp(20px,calc(3 * var(--vw)),28px);padding:.7em 1em;border-radius:10px;letter-spacing:.1em}
.btn.back{align-self:flex-start}
#lobby .mark{font-family:var(--display);font-size:clamp(40px,calc(10 * var(--vw)),68px);letter-spacing:.12em;color:var(--bronze);line-height:1}
#lobby .mark small{display:block;font-size:.26em;letter-spacing:.3em;color:var(--paper-dim);margin-top:.8em;font-family:var(--display)}
/* 로비: 게임 속 노을 풍경을 뒤에 깔고, 가운데를 어둡게 눌러 글자가 읽히게 */
/* 로비도 게임처럼 800×450 고정 무대를 화면에 맞게 키우고 줄인다 (fitStage) */
#lobbyBg{position:fixed;inset:0;z-index:0;pointer-events:none}
#lobbyBg > .scene{position:absolute;inset:0;overflow:hidden}
#lobby{--W:800px;--H:450px;--vw:10px;--vh:4.5px;position:fixed;left:50%;top:50%;width:var(--W);height:var(--H);max-width:none;margin:0;min-height:0;padding:12px 40px;gap:10px;
  transform:translate(-50%,-50%) scale(var(--sc,1));transform-origin:50% 50%;z-index:1;justify-content:center}
#lobby .mark{font-size:64px}
#lobby.sub .mark{font-size:30px}#lobby.sub .mark small{margin-top:.45em;font-size:.36em}
#lobby .menu{width:100%;max-width:460px;margin:0 auto}
#lobby.sub .menu{max-width:720px}
#lobby .btn.back{position:absolute;left:14px;top:12px}
#lobby input[type=text]{font-size:16px}
#menuMulti:not([hidden]){display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
#lobby .panel{padding:12px 14px;gap:8px}
#lobby h3{font-size:18px}
#lobby .lvrow{font-size:15px;gap:6px}
#lobby .lvrow > .muted{min-width:4.5em;font-size:13px}
#lobby .lvrow label{position:relative;border:1px solid var(--bronze-dim);border-radius:999px;padding:.38em .95em;background:rgba(27,21,19,.6);cursor:pointer;transition:background .12s}
#lobby .lvrow label input{position:absolute;opacity:0;pointer-events:none}
#lobby .lvrow label:has(input:checked){background:var(--bronze);border-color:var(--bronze);color:var(--lacquer);font-weight:700}
#lobby .lvrow label:has(input:checked) small{color:var(--lacquer2)}
#lobby .lvrow label:has(input:focus-visible){outline:2px solid #f0d79a;outline-offset:2px}
#menuSingle:not([hidden]){max-width:600px}
#lobby #soloPanel{gap:12px;padding:16px 18px}
#lobby #soloPanel h3{font-size:22px}
#lobby #startSolo{font-size:17px;padding:.55em 1.3em}
.seat input[type=text]{max-width:104px!important;font-size:15px!important;padding:.35em .5em}
.seat select{font-size:13px;max-width:96px}
#lobbyBg > .scene::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 50% 48%,rgba(20,14,11,.72),rgba(20,14,11,.35) 65%,rgba(20,14,11,.15))}
#lobby .mark{color:#f3dca6;text-shadow:0 2px 14px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5)}
#lobby .mark small{color:#efe6d2;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#lobby .mark small::before,#lobby .mark small::after{content:'';display:inline-block;width:2.2em;height:1px;background:rgba(239,230,210,.5);vertical-align:.35em;margin:0 .9em}
#goSingle{box-shadow:0 6px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,240,200,.45)}
#goMulti{background:rgba(27,21,19,.78);color:#f0d79a;border:1px solid var(--bronze);box-shadow:0 6px 20px rgba(0,0,0,.35)}
#menuMain .row .btn,#lobby .btn.back{background:rgba(27,21,19,.72)}
#lobby .panel{background:rgba(42,32,28,.92);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.panel{border:1px solid var(--bronze-dim);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--lacquer2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{background:var(--lacquer);border:1px solid var(--bronze-dim);color:var(--paper);border-radius:6px;padding:.45em .7em;font:inherit;font-size:15px;min-width:0;flex:1}
.seat{display:flex;gap:8px;align-items:center}
.lvrow{gap:6px 14px;font-size:14px}.lvrow label{display:flex;gap:4px;align-items:center;cursor:pointer}
.seat .dot{width:24px;display:flex;justify-content:center}.seat .dot .chibi{width:22px}
.seat select{background:var(--lacquer);color:var(--paper);border:1px solid var(--bronze-dim);border-radius:6px;padding:.3em}

#game{--W:800px;--H:450px;--vw:10px;--vh:4.5px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:calc(26px + calc(7 * var(--vh)));box-sizing:border-box;position:fixed;left:50%;top:50%;width:var(--W);height:var(--H);transform:translate(-50%,-50%) scale(var(--sc,1));transform-origin:50% 50%;perspective:1300px;perspective-origin:50% 10%;--tilt:42deg;--pw:clamp(104px,min(calc(17 * var(--vw)),calc(30 * var(--vh))),250px);
  background:radial-gradient(ellipse at 50% 70%,#2a211b,var(--lacquer) 70%)}
#game > .scene{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.scene .sky,.scene .dusk{position:absolute;inset:0}
.scene .sky{background:linear-gradient(#f2b77a 0%,#d9825e 38%,#6b3f46 70%,#2a1d22 100%)}
.scene .dusk{background:linear-gradient(#0d1024 0%,#2a1a3a 45%,#5a2420 80%,#1a1010 100%);opacity:var(--dusk,0);transition:opacity 3s ease}
.scene svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%}
.scene .m3{fill:#5a3a44;opacity:.55}.scene .m2{fill:#3a2730;opacity:.8}.scene .m1{fill:#22181c}
.scene .tower{fill:#22181c;opacity:.9}
.scene .river{fill:#1c2a38}.scene .shine rect{fill:#f2c98a;opacity:.35;animation:shine 4s ease-in-out infinite alternate}
.scene .shine rect:nth-child(2){animation-delay:1.3s}.scene .shine rect:nth-child(3){animation-delay:2.1s}.scene .shine rect:nth-child(4){animation-delay:.6s}
@keyframes shine{from{opacity:.1;transform:translateX(0)}to{opacity:.5;transform:translateX(18px)}}
.scene .cloud{position:absolute;height:14px;border-radius:14px;background:#fbe3c2;opacity:.25;animation:drift 90s linear infinite}
.scene .cloud.c1{top:12%;width:180px;left:-200px}.scene .cloud.c2{top:22%;width:120px;left:-140px;animation-duration:130s;animation-delay:-50s}
@keyframes drift{to{transform:translateX(calc(var(--W) + 400px))}}
@media (prefers-reduced-motion:reduce){.scene .cloud,.scene .shine rect{animation:none}}
/* 2.5D: 판은 뒤로 눕고, 건물과 캐릭터는 판 위에 선다. 가운데 화면은 판 밖에서 평평하게 뜬다 */
#game #board{transform:translate(var(--dx,0px),var(--dy,0px)) rotateX(var(--tilt));transform-origin:50% 50%;transform-style:preserve-3d;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);aspect-ratio:1;width:min(calc((var(--W) - 2 * var(--pw) - 40px) / 1.414), calc((var(--H) - 56px) / 1.38));box-shadow:0 0 0 2px #c9a25a, 0 60px 80px rgba(0,0,0,.75)}
#game .cell{transform-style:preserve-3d;overflow:visible}
#game .cell .bld{transform-origin:50% 100%;transform:rotateX(calc(-1 * var(--tilt)));height:92%;width:58%;right:3%;bottom:40%}
#game .cell .bld.gold svg{filter:sepia(1) saturate(4.5) hue-rotate(-8deg) brightness(1.18) drop-shadow(0 0 4px #f5c75a)}
#game .cell .lab{position:absolute;left:3px;bottom:2px;max-width:62%;z-index:2;pointer-events:none;text-shadow:0 1px 2px #000}
#game .cell .nm{margin:0;font-size:calc(var(--bw,600px) / 9 * .17);line-height:1.1;word-break:keep-all;overflow-wrap:normal;white-space:normal}
#game .cell .pr{font-size:calc(var(--bw,600px) / 9 * .155);color:#ddd0b6}
#game .cell.corner .lab{max-width:96%}
#game .cell.corner .nm{white-space:nowrap}  /* 귀퉁이 이름은 한 줄로: 두 줄이면 배·사당 모형에 가린다 */
#game .cell .cimg{position:absolute;inset:14% 14% 26% 14%;opacity:.9;pointer-events:none}
#game .cell .cimg svg{width:100%;height:100%}
#game .cell.corner[id="c0"] .nm{font-family:var(--body);font-weight:700;letter-spacing:.12em;color:#f0d79a}
#eraBar{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:min(calc(var(--W) - 2 * var(--pw) - 40px),900px);z-index:9;display:flex;flex-direction:column;gap:2px}
#eraBar{background:rgba(22,15,12,.78);border-radius:8px;padding:3px 10px 4px;box-shadow:0 2px 10px rgba(0,0,0,.4)}  /* 밝은 노을 위에서도 읽히게 */
#eraBar #era span{font-size:clamp(9px,calc(1.05 * var(--vw)),13px);color:#d9ccb2;border-color:#5a4838}
#eraBar #era span.past{color:#a08660;border-color:#a08660}#eraBar #era span.now{color:#f0d79a;border-color:#e0b85a}
#eraBar #eraCap{color:#d9ccb2}
#eraBar #eraCap{font-size:clamp(10px,calc(1.15 * var(--vw)),14px)}
.pc{position:absolute;z-index:9;width:var(--pw);aspect-ratio:1}
.pc.tl{left:6px;top:6px}.pc.tr{right:6px;top:6px}.pc.br{right:6px;bottom:6px}.pc.bl{left:6px;bottom:6px}
.pc .pl{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-size:calc(var(--pw) * .075);padding:10px;background:rgba(42,32,28,.94);border-width:2px;border-radius:10px}
.pc .pl b{font-size:1.35em;white-space:normal;overflow:visible;line-height:1.35;padding-top:.08em}
.pc .pl .cash{font-size:1.4em;font-weight:700;text-align:center}
.pc .pl .rank{text-align:center;line-height:1.45}
.pc .pl .face{width:calc(var(--pw) * .24)}
.pc .pl .rank{white-space:normal}
.rare{font-size:.75em;border:1px dashed currentColor;border-radius:3px;padding:0 .2em}
#game .cell.own::after{content:'';position:absolute;right:6%;bottom:34%;width:50%;height:16%;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(2px);pointer-events:none}
/* 입체: 칸은 판에서 살짝 솟은 타일, 앞면에 두께가 보인다. 모서리 그림과 말은 판 위에 서고 그림자를 드리운다 */
#game{--th:calc(var(--bw,600px) * .022)}
#game #board{gap:calc(var(--bw,600px) * .006);background:linear-gradient(#2a1c12,#140d08)}
#game .cell{transform:translateZ(var(--th));box-shadow:inset 0 1px 0 rgba(255,236,200,.12),inset 0 -2px 3px rgba(0,0,0,.35)}
#game .cell::before{content:'';position:absolute;left:0;right:0;top:100%;height:var(--th);background:linear-gradient(#6b4c33,#2a1c12);transform-origin:50% 0;transform:rotateX(-90deg);pointer-events:none}
#game .cell .band{height:12%;transform:translateZ(calc(var(--th) * .5));box-shadow:0 2px 2px rgba(0,0,0,.45)}
#game .cell.own{box-shadow:inset 0 0 0 2px var(--oc),inset 0 -2px 3px rgba(0,0,0,.35)}
#game .cell .cimg{inset:auto 18% 30% 18%;height:62%;transform-origin:50% 100%;transform:rotateX(calc(-1 * var(--tilt)));filter:drop-shadow(0 3px 2px rgba(0,0,0,.55))}
#game .cell.corner::after{content:'';position:absolute;left:24%;right:24%;bottom:27%;height:10%;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(2px);pointer-events:none}
#game{--cu:calc(var(--bw,600px) / 9)}
#game .mdl{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
#game .mdl i{position:absolute;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.35)}
#game .cell .water{position:absolute;left:6%;right:6%;top:22%;height:44%;border-radius:40%;background:repeating-linear-gradient(170deg,rgba(95,154,154,.55) 0 3px,rgba(40,80,90,.5) 3px 8px);pointer-events:none}
#game #tokens{transform-style:preserve-3d;transform:translateZ(calc(var(--th) + 1px))}  /* 말은 솟은 칸 윗면 위에 선다 (안 그러면 칸에 묻힌다) */
#game .tk{transform-style:preserve-3d;transform:rotateX(calc(-1 * var(--tilt)));transform-origin:0 0}
#game .tk .ch{width:calc(var(--bw,600px) / 9 * .5);left:calc(var(--bw,600px) / 9 * -.25)}
#game .ctrHole{grid-column:2/9;grid-row:2/9;background:radial-gradient(ellipse at 50% 50%,#3a2c22,#241b16 75%);position:relative}
#game .ctrHole i{position:absolute;width:0;height:0}
#game > #center{position:absolute;z-index:8;border-radius:8px;background:rgba(27,21,19,.84);box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;padding:8px 12px}
#game > #center #stage{flex:1;gap:6px}
#game > #center #mid{flex:1;display:flex;align-items:center;min-height:0;margin-top:4px;position:relative;z-index:1}
#game > #center #result{font-size:clamp(17px,calc(2.8 * var(--vw)),40px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-wrap:nowrap;justify-content:center;min-height:1.25em}
#game > #center #stage{overflow:hidden}
#game > #center #result{position:relative;z-index:3;text-shadow:0 2px 8px #000}
#game > #center #faces{font-size:clamp(10px,calc(1.2 * var(--vw)),15px)}
#game > #center #say{font-size:clamp(11px,calc(1.3 * var(--vw)),16px)}
#game > #center #actrow .btn{font-size:clamp(12px,calc(1.4 * var(--vw)),18px);padding:.45em 1em}
#game > #center #gauge{height:clamp(18px,calc(2.4 * var(--vw)),28px);max-width:none;min-width:140px}
#game > #center #gauge .lbl{font-size:clamp(9px,calc(1 * var(--vw)),12px)}

#sideL{position:absolute;z-index:9;left:6px;top:calc(var(--pw) + 12px + var(--trayH) + 4px);bottom:calc(var(--pw) + 12px);width:var(--pw);display:flex;flex-direction:column;gap:6px;min-height:0}
#sideL .tools{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0}
#sideL .tools .btn.ico{height:26px;padding:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:15px;font-weight:700;background:rgba(27,21,19,.78);border-radius:7px}
#sideL .tools .btn.ico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sideL .tools .btn.arm{background:#8e3328;border-color:#e2574c}
#liveLog{flex:1;min-height:0;overflow:hidden;font-size:calc(var(--pw) * .074);line-height:1.4;color:#cbbfa6;background:rgba(20,14,11,.55);border-radius:8px;padding:5px 7px;display:flex;flex-direction:column;gap:3px;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
#liveLog .new{color:var(--paper)}
/* 플레이어 옆 쟁반: 오수전 더미(100수전에 한 닢, 열 닢씩 한 더미)와 모은 유물 카드 */
#game{--trayH:44px}
#game.p4 #sideL{bottom:calc(var(--pw) + 12px + var(--trayH) + 4px)}
/* 판 소식(기록)은 오른쪽: 오른쪽 위 플레이어 쟁반 아래 ~ 오른쪽 아래 플레이어 위 */
#sideR{position:absolute;z-index:9;right:6px;top:calc(var(--pw) + 12px + var(--trayH) + 4px);bottom:calc(var(--pw) + 12px);width:var(--pw);display:flex;flex-direction:column;min-height:0}
#game.p3 #sideR{bottom:calc(var(--pw) + 12px + var(--trayH) + 4px)}
.tray{position:absolute;z-index:9;width:var(--pw);height:var(--trayH);display:flex;align-items:flex-end;justify-content:space-between;gap:4px;pointer-events:none}
.tray.tl{left:6px;top:calc(var(--pw) + 10px)}.tray.tr{right:6px;top:calc(var(--pw) + 10px);flex-direction:row-reverse}
.tray.bl{left:6px;bottom:calc(var(--pw) + 10px)}.tray.br{right:6px;bottom:calc(var(--pw) + 10px);flex-direction:row-reverse}
.tray .coins{display:flex;gap:3px;align-items:flex-end;height:100%}
.tray .pile{position:relative;width:21px;height:100%}
.tray .coin{position:absolute;left:0;width:21px;height:8px;border-radius:50%;background:radial-gradient(ellipse at 45% 35%,#f3d58a,#c39a45 55%,#8a6428);box-shadow:0 1.5px 0 #5a3f1a,0 2px 2px rgba(0,0,0,.35)}
.tray .coin.top::after{content:'';position:absolute;left:50%;top:50%;width:5px;height:3px;background:#3a2812;transform:translate(-50%,-50%);border-radius:1px;box-shadow:0 0 0 1px rgba(90,63,26,.6)}
.tray .coin.new{animation:coindrop .35s ease-out backwards}
@keyframes coindrop{from{transform:translateY(-14px);opacity:0}}
.tray .more{font-size:9px;color:#f0d79a;align-self:flex-start;text-shadow:0 1px 2px #000}
.tray .relics{display:flex;align-items:flex-end;height:100%;pointer-events:auto}
.tray .rc{width:27px;height:37px;padding:1px;border-radius:3px;margin-left:-12px;background:linear-gradient(#f4ecda,#d9ccae);border:1.5px solid #9a7a3e;box-shadow:0 2px 4px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;transform:rotate(var(--r,0deg));transition:transform .15s}
.tray .rc:first-child{margin-left:0}
.tray .rc .relicart{width:100%;height:100%;display:block}

let aiTimer = null;

const AI_LV = [

function aiDecide(p){
  const L = AI_LV[p.lv ?? 1];
  if(G.phase === 'throw'){
    if(p.gate && p.cash > L.gate) return { k:'pay' };
    // 크게: 깐깐한 부처님은 자주, 보통은 뒤처졌거나 관문에 갇혔을 때만

// 멈춤 감시: 컴퓨터 차례인데 3초 넘게 아무 일이 없으면 다시 움직이게 한다 (화면 그리기 오류 등으로 예약이 끊긴 경우)

// 9×9 둘레: 0 = 왼쪽 아래(출발) → 아랫줄 오른쪽으로 → 오른쪽 줄 위로 → 윗줄 왼쪽으로 → 왼쪽 줄 아래로
function gridPos(i){
  if(i <= 8) return [9, 1 + i];
  if(i <= 16) return [9 - (i - 8), 9];
  if(i <= 24) return [1, 9 - (i - 16)];
  return [1 + (i - 24), 1];

/* 판 위 입체 모형. 좌표는 칸 한 변 = 1, x 오른쪽, y 앞쪽(보는 사람 쪽), z 위.
   상자 {b:[x,y,z,가로,세로,높이], c:[윗면,앞면,옆면]} · 지붕 {roof:[x,y,z,가로,세로,높이], c:[앞,뒤,박공]} · 선 판 {plane:[x,y,z,가로,높이], c} */
function m3(parts){
  const u = v => `calc(var(--bw,600px) / 9 * ${(+v).toFixed(3)})`;
  const f = (l, t, w, hh, bg, tf, o, clip) => `<i style="left:${u(l)};top:${u(t)};width:${u(w)};height:${u(hh)};background:${bg};transform-origin:${o || '50% 50%'};transform:${tf}${clip ? `;clip-path:${clip}` : ''}"></i>`;
  return '<div class="mdl">' + parts.map(P => {
    if(P.b){ const [x,y,z,w,d,hh] = P.b, [ct,cf,cs] = P.c;
      return f(x, y, w, d, ct, `translateZ(${u(z + hh)})`) +
        f(x, y + d, w, hh, cf, `translateZ(${u(z)}) rotateX(90deg)`, '50% 0') +
        f(x - hh, y, hh, d, cs, `translateZ(${u(z)}) rotateY(90deg)`, '100% 50%') +
        f(x + w, y, hh, d, cs, `translateZ(${u(z)}) rotateY(-90deg)`, '0 50%'); }
    if(P.roof){ const [x,y,z,w,d,rh] = P.roof, [cf,cb,cg] = P.c, L = Math.hypot(d / 2, rh), a = Math.atan2(rh, d / 2) * 180 / Math.PI;
      return f(x, y + d - L, w, L, cf, `translateZ(${u(z)}) rotateX(${-a}deg)`, '50% 100%') +
        f(x, y, w, L, cb, `translateZ(${u(z)}) rotateX(${a}deg)`, '50% 0') +
        f(x - rh, y, rh, d, cg, `translateZ(${u(z)}) rotateY(90deg)`, '100% 50%', 'polygon(100% 0,0 50%,100% 100%)') +
        f(x + w, y, rh, d, cg, `translateZ(${u(z)}) rotateY(-90deg)`, '0 50%', 'polygon(0 0,100% 50%,0 100%)'); }
    const [x,y,z,w,hh] = P.plane;
    return f(x, y, w, hh, P.c, `translateZ(${u(z)}) rotateX(90deg)`, '50% 0', P.clip);

/* 저포 막대 3D: 외부 라이브러리 없이 캔버스에 직접 그린다 (아티팩트에서도 동작).

const S3 = (() => {
  const LEN = 1.0, WID = 0.17, THK = 0.06, DUR = 1150;
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dur = DUR, resizing = false, cssW = 0, cssH = 0, salt = 0, cv = null, ctx = null, raf = 0, plan = null, t0 = 0, faces = null, ro = null;
  const tex = [];   // tex[k] = { w: canvas, b: canvas }
  const rad = d => d * Math.PI / 180;
  const easeOut = s => 1 - Math.pow(1 - s, 3);

  function svgImg(svg){
    const im = new Image();
    im.onload = () => { buildTex(); draw(); };
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" '));
    return im;
  }
  let imgP = null, imgO = null;
  function buildTex(){
    for(let k = 0; k < 5; k++){
      const mk = (white) => {
        const c = document.createElement('canvas'); c.width = 48; c.height = 280;
        const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 48, 0);
        if(white){ gr.addColorStop(0, '#bfb091'); gr.addColorStop(.5, '#f6eedc'); gr.addColorStop(1, '#bfb091'); }
        else { gr.addColorStop(0, '#0d0a09'); gr.addColorStop(.5, '#3d322b'); gr.addColorStop(1, '#0d0a09'); }
        g.fillStyle = gr; g.fillRect(0, 0, 48, 280);
        g.strokeStyle = white ? 'rgba(120,90,50,.25)' : 'rgba(224,194,122,.12)'; g.lineWidth = 1;   // 나뭇결
        for(let i = 0; i < 5; i++){ g.beginPath(); const x = 8 + i * 8 + (k * 3 % 5); g.moveTo(x, 4); g.bezierCurveTo(x + 3, 90, x - 3, 190, x + 1, 276); g.stroke(); }

  // 회전 = Ry(yaw) · Rx(pitch) · Rz(roll)
  function rot(p, yaw, pitch, roll){

    { v: [ci(-1, 1, -1), ci(1, 1, -1), ci(1, 1, 1), ci(-1, 1, 1)], n: [0, 1, 0], kind: 'w' },
    { v: [ci(1, -1, -1), ci(-1, -1, -1), ci(-1, -1, 1), ci(1, -1, 1)], n: [0, -1, 0], kind: 'b' },
    { v: [ci(1, -1, -1), ci(1, -1, 1), ci(1, 1, 1), ci(1, 1, -1)], n: [1, 0, 0], kind: 's' },
    { v: [ci(-1, -1, 1), ci(-1, -1, -1), ci(-1, 1, -1), ci(-1, 1, 1)], n: [-1, 0, 0], kind: 's' },
    { v: [ci(-1, -1, 1), ci(-1, 1, 1), ci(1, 1, 1), ci(1, -1, 1)], n: [0, 0, 1], kind: 'e' },
    { v: [ci(1, -1, -1), ci(1, 1, -1), ci(-1, 1, -1), ci(-1, -1, -1)], n: [0, 0, -1], kind: 'e' },

const SOLO_WIN = ['판이 멈추었다. 양생이 세운 것이 더 많이 남았다.', '부처님이 처음으로 빙그레 웃으신 것 같았다.', '원작에서는 이때 한 여인이 불당에 나타나, 양생과 짧고도 긴 인연을 맺는다.', '"이긴 것은 막대가 아니라, 끝까지 남긴 마음이다." — 어디선가 들린 듯한 말 (창작)'];

const STORY_WHO = { intro:['', '', '양생', '', ''], win:['', '', '', ''], lose:['', '', '부처님'] };
/* 이야기 장면: 줄마다 장면 상태(b0, b1 … 누적 + now현재)를 바꾸고 글자를 하나씩 보여 준다. 누르면 다 보이기 → 다음 줄. 건너뛰기 · Esc */
function story(lines, src, kind){
  kind = kind || (lines === SOLO_WIN ? 'win' : lines === SOLO_LOSE ? 'lose' : 'intro');
  const RMs = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  return new Promise(res => {
    const box = $('story'), p = $('storyP'), names = STORY_WHO[kind] || [];
    let i = 0, chs = [], k = 0, tm = null;
    $('storySrc').textContent = src || '';
    const done = () => { clearInterval(tm); tm = null; chs.forEach(c => c.classList.add('on')); box.classList.add('done'); };
    const show = () => {
      box.className = 's-' + kind + ' ' + Array.from({ length:i + 1 }, (_, j) => 'b' + j).join(' ') + ' now' + i;
      $('storyWho').textContent = names[i] || '';
      p.innerHTML = lines[i]; chs = [];
      const tw = document.createTreeWalker(p, NodeFilter.SHOW_TEXT), ts = []; let n;
      while((n = tw.nextNode())) ts.push(n);
      ts.forEach(t => { const f = document.createDocumentFragment();
        for(const c of t.nodeValue){ const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; f.appendChild(s); chs.push(s); }
        t.replaceWith(f); });
      k = 0; clearInterval(tm);
      if(RMs) return done();
      tm = setInterval(() => { if(k < chs.length) chs[k++].classList.add('on'); else done(); }, 42);
    };
    const close = () => { clearInterval(tm); tm = null; box.hidden = true; box.onclick = null; $('storySkip').onclick = null; removeEventListener('keydown', key, true); res(); };
    const next = () => { if(tm){ done(); return; } i++; if(i < lines.length) show(); else close(); };
    const key = e => {
      if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); }
      else if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight'){ e.preventDefault(); e.stopPropagation(); next(); }
    };
    $('storySkip').onclick = e => { e.stopPropagation(); close(); };
    box.onclick = next;
    addEventListener('keydown', key, true);
    box.hidden = false; fitStage(); show();
  });
}

/* =====================================================================
   7. 한 기기 / 방
   ===================================================================== */
const isHostSide = () => !NET || NET.host;
const lenOf = name => document.querySelector(`input[name=${name}]:checked`)?.value !== 'long';   // 기본은 짧은 판
/* 차례 제한 10초: 온라인 방에서 사람 차례에만. 막대·말 움직임과 사건 창이 끝난 뒤부터 센다.
   방장이 시간을 재고, 끝나면 대신 움직인다 (던지기 · 지나가기 · 카드 닫기). */
const TURN_MS = 10000;
let tmKey = null, tmStart = 0, tmFired = null;
function turnClock(){
  const el = $('tleft');
  if(!G || G.over || !NET || cur().ai || cur().out){ if(el) el.textContent = ''; return; }
  if(G.seq !== tmKey){ tmKey = G.seq; tmStart = 0; }
  if(!tmStart){ if(animating() || !$('evt').hidden){ if(el) el.textContent = ''; return; } tmStart = Date.now(); }
  const left = Math.max(0, TURN_MS - (Date.now() - tmStart));
  if(el){ el.textContent = Math.ceil(left / 1000) + '초'; el.classList.toggle('hurry', left <= 3000); }
  if(left === 0 && isHostSide() && tmFired !== tmKey){ tmFired = tmKey; timeUp(); }
}
function timeUp(){
  const p = cur(), ph = G.phase;
  if(gauge.on && myTurn()) return gaugeEnd();
  let a = null;
  if(ph === 'throw') a = { k:'throw', x:0 };
  else if(['buy','up','take'].includes(ph)) a = { k:'skip' };
  else if(ph === 'card') a = { k:'ok' };
  else if(ph === 'tp') a = { k:'tp', x:(SONG() + 1) % N };
  else if(ph === 'pick'){ const m = myProps(p, G.pick.kind); if(m.length) a = { k:'pick', x:m[0] }; }
  if(a){ log(`${p.nm}: 시간 초과`); act(p.id, a); }
}
setInterval(turnClock, 200);
const myTurn = () => G && !G.over && ME && ME.includes(cur().id);
function send(a){
  if(!myTurn()) return;
  a = { ...a, s: G.seq };
  if(isHostSide()) act(cur().id, a);
  else { NET.n = (NET.n||0) + 1; NET.r.presence({ it:{ n:NET.n, pid:cur().id, a } }).catch(()=>{}); }
}
function publish(){
  if(NET && NET.host){ const st = { ...G, log: G.log.slice(-3) }; NET.r.presence({ st }).catch(e => console.warn('상태가 너무 큼?', e)); }
  render();
}
function enterGame(){
  for(const k in DISP) delete DISP[k];

// '창 모드'를 직접 누르면 그 뒤로는 저절로 하지 않는다. 안 되는 곳(아이폰 사파리, 일부 임베드)에서는 조용히 넘어간다.
let fsAuto = true;
const isFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const canFS = () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function lockLand(){ try{ const o = screen.orientation; if(o && o.lock) o.lock('landscape').catch(()=>{}); }catch(e){} }
function enterFS(quiet){
  if(isFS()) return lockLand();
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  const fail = () => { fsAuto = false; if(!quiet) toastSay('여기서는 전체화면을 쓸 수 없어요.'); };
  if(!req) return fail();
  try{ const r = req.call(el, { navigationUI:'hide' }); if(r && r.then) r.then(lockLand).catch(fail); else lockLand(); }catch(e){ fail(); }
}
function toggleFS(){
  if(isFS()){ fsAuto = false; (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  fsAuto = true; enterFS(false);
}

/* ---- Firebase 방 (아티팩트의 room과 같은 모양: join → presence / onPeers / peers) ----
   FB_CONFIG에 Firebase 콘솔 → 프로젝트 설정 → 내 앱(웹)의 firebaseConfig 값을 붙여 넣는다.
   apiKey는 비밀이 아니다. 보안은 Realtime Database 규칙이 맡는다 (자기 peers/{uid}에만 쓰기).
   상태는 JSON 문자열로 저장한다: Realtime Database는 null과 빈 배열을 지워 버리기 때문. */
const FB_CONFIG = {
  apiKey: 'AIzaSyAVSIFMxhpQRl3UtGaCZQ6-SXozK9LrJbw',
  authDomain: 'test-d810d.firebaseapp.com',
  databaseURL: 'https://test-d810d-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'test-d810d',
  appId: '1:837047713907:web:7de42e23de537cda69ea06',
};
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
async function firebaseRoom(){
  if(!FB_CONFIG.apiKey || !FB_CONFIG.databaseURL) throw new Error('FB_CONFIG가 비어 있음');
  const [{ initializeApp }, A, D] = await Promise.all(
    ['firebase-app.js','firebase-auth.js','firebase-database.js'].map(f => import(FB_SDK + f)));
  const app = initializeApp(FB_CONFIG), auth = A.getAuth(app), db = D.getDatabase(app);
  await A.setPersistence(auth, A.browserSessionPersistence);   // 탭마다 다른 사람 (새로고침해도 유지)
  const { user } = await A.signInAnonymously(auth);
  return { async join(name){
    const base = D.ref(db, `rooms/${name}/peers`), meRef = D.child(base, user.uid);
    const joined = Date.now(); let mine = {}, list = [];
    const subs = [];
    await D.onDisconnect(meRef).remove();                      // 창을 닫으면 방에서 빠짐
    D.onValue(base, snap => {
      list = Object.entries(snap.val() || {}).map(([uid, x]) => {
        let pr = {}; try{ pr = JSON.parse(x.j || '{}'); }catch(e){}
        return { peer:uid, kind:'viewer', presence:pr, isMe: uid === user.uid, sameTab: uid === user.uid, t: x.t || 0 };
      }).sort((a, b) => a.t - b.t);
      subs.forEach(f => f({ peers: list }));
    });
    return {
      presence(o){ Object.assign(mine, o); return D.set(meRef, { j: JSON.stringify(mine), t: joined }); },
      onPeers(f){ subs.push(f); },
      peers(){ return list; },
    };
  }};
}
let ROOM = null;
(async () => {
  try{ ROOM = await firebaseRoom(); }catch(e){ console.warn('Firebase 연결 실패:', e); ROOM = null; }
  if(!ROOM){ $('roomNote').textContent = '온라인 서버에 연결하지 못했어요. 지금은 한 기기에서 하기만 돼요.'; return; }
  $('roomNote').textContent = '방을 만들고 방 번호를 친구에게 알려 주세요. 2~4명.';
  $('roomCtl').hidden = false;
})();
async function openRoom(code, host){
  const nick = ($('nick').value || '').trim().slice(0,10) || (host ? '방장' : '손님');
  let r;
  try{ r = await ROOM.join('jeopo-' + code); }catch(e){ return alertLobby('방에 들어가지 못했어요. 잠시 뒤 다시 해 보세요.'); }
  NET = { r, host, code, nick, seen:{} };
  await r.presence({ nick, host, it:null, st:null }).catch(()=>{});
  $('roomCtl').hidden = true; $('waiting').hidden = false;
  r.onPeers(ch => onRoom(ch.peers));
  onRoom(r.peers());
}
$('mkRoom').onclick = () => openRoom(String(Math.floor(1000 + Math.random()*9000)), true);
$('joinRoom').onclick = () => { const c = ($('code').value||'').trim(); if(!/^\d{4}$/.test(c)) return alertLobby('방 번호 네 자리를 입력해 주세요.'); openRoom(c, false); };
function onRoom(peers){
  if(!NET) return;
  const people = peers.filter(p => p.kind === 'viewer' && p.presence && p.presence.nick);
  if(!G){
    const hostPeer = people.find(p => p.presence.host);
    $('waiting').innerHTML = `<b>방 번호 ${NET.code}</b><div class="muted" style="font-size:14px">${people.map(p => esc(p.presence.nick) + (p.presence.host?' (방장)':'') + (p.isMe&&p.sameTab?' · 나':'')).join(', ') || '연결하는 중…'}</div>` +
      (NET.host ? `<div class="row"><button class="btn main" id="goRoom" ${people.length<2?'disabled':''}>판 열기 (${Math.min(people.length,4)}명)</button></div>` : `<div class="muted" style="font-size:13px">${hostPeer ? '방장이 판을 열기를 기다리는 중…' : '방장을 찾는 중… 방 번호가 맞는지 확인해 주세요.'}</div>`);
    if(NET.host && $('goRoom')) $('goRoom').onclick = () => {
      startGame(newGame(people.slice(0,4).map(p => ({ id:p.peer, nm:p.presence.nick })), { short: lenOf('lenRoom') })); ME = [people.find(p => p.isMe && p.sameTab).peer];
      enterGame(); publish();
    };
    if(!NET.host && hostPeer && hostPeer.presence.st){ G = JSON.parse(JSON.stringify(hostPeer.presence.st)); ME = [people.find(p => p.isMe && p.sameTab)?.peer]; enterGame(); }
    return;
  }
  if(NET.host){
    for(const p of people){
      const it = p.presence.it; if(!it || p.isMe) continue;
      if((NET.seen[p.peer]||0) >= it.n) continue;
      NET.seen[p.peer] = it.n;
      if(it.pid === p.peer) act(p.peer, it.a);
    }
  } else {
    const hostPeer = people.find(p => p.presence.host);
    if(hostPeer && hostPeer.presence.st && hostPeer.presence.st.seq !== G.seq){ G = JSON.parse(JSON.stringify(hostPeer.presence.st)); render(); }
  }
}
